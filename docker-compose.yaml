services:
  postgres:
    image: postgres:17-alpine
    container_name: knowyou-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowyou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowyou_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-knowyou}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowyou} -d ${POSTGRES_DB:-knowyou}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: knowyou-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RAWG_API_KEY: ${RAWG_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OMDB_API_KEY: ${OMDB_API_KEY}
      PORT: 3001

  landing:
    build:
      context: .
      dockerfile: Dockerfile
      target: landing
    container_name: knowyou-landing
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      ASTRO_PORT: 4321

volumes:
  pgdata:
  apk_data:
